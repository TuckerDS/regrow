# Todo lo que compile cargo va a repository/build/ (los binarios finales se
# organizan por target: build/<triple>/release/...).
[build]
target-dir = "build"

# Compilaciones cruzadas para los binarios publicables (scripts/dist.sh):
# - Windows: mingw-w64 enlaza el .exe (corre en Win10/11 x64 sin dependencias).
# - Linux: musl-cross enlaza estático contra musl → corre en cualquier
#   distro x86_64, sin quedar atado a la glibc de la máquina de build.
[target.x86_64-pc-windows-gnu]
linker = "x86_64-w64-mingw32-gcc"

[target.x86_64-unknown-linux-musl]
linker = "x86_64-linux-musl-gcc"
